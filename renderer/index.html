// renderer/index.html
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>venv.sh</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>venv.sh</h1>
    <p>Python Version: <span id="python-version">Loading...</span></p>

    <h2>Create Virtual Environment</h2>
    <input type="text" id="venv-name" placeholder="Virtual Environment Name">
    <input type="text" id="python-path" placeholder="Path to Python (optional)">
    <button id="create-venv-btn">Create</button>
    <p id="create-venv-message"></p>

    <h2>List Packages</h2>
    <input type="text" id="venv-path" placeholder="Path to Virtual Environment">
    <button id="list-packages-btn">List Packages</button>
    <ul id="package-list"></ul>

    <h2>Install Package</h2>
    <input type="text" id="install-venv-path" placeholder="Path to Virtual Environment">
    <input type="text" id="package-name" placeholder="Package Name">
    <button id="install-package-btn">Install Package</button>

    <div id="console" style = "height:400px;width: 500px;margin-top:10px;overflow:auto;border:2px solid black;text-align: center;" >CONSOLE STUFFFS</div>

    <script src="./index.js"></script>
  </body>
</html>
